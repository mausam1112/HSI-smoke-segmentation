# ──────────────────────────────────────────────
# Base configuration — shared defaults for all
# HSI-Segmentation experiments.
#
# Override any field in a child config file;
# all keys here are used as fallbacks.
# ──────────────────────────────────────────────

experiment_name: "exp_001_baseline"

# ── Data ──────────────────────────────────────
data:
  dataset_root: "./data/HSSDataset/HSS_VOC"
  image_dir: "npy_multichannel"
  mask_dir: "Mask"
  data_version: "original"       # subfolder under split/
  image_size: [216, 408]         # [H, W]
  img_ext: ".npy"
  mask_ext: ".png"
  img_channels: 25
  mask_channels: 1

# ── Model ─────────────────────────────────────
# Set model.name to one of:
#   JustoUNetSimple        — lightweight 2-level UNet (original baseline)
#   MixtureOfPrototypes    — MoP network (paper implementation)
#
# All other keys are forwarded verbatim as constructor kwargs.
# Use model-specific experiment configs (see configs/exp_002_mop.yaml)
# to avoid passing unsupported kwargs to a model.
model:
  name: "JustoUNetSimple"
  in_channels: 25
  num_classes: 1

# ── Training ──────────────────────────────────
training:
  batch_size: 16
  epochs: 200
  learning_rate: 3.0e-3
  loss: "bce_dice"               # bce_dice | mop_bce_dice | dice | per_sample_dice
  alpha: 0.3                     # BCE weight in bce_dice / mop_bce_dice
  lambda_div: 0.1                # prototype diversity weight (mop_bce_dice only)

  # Learning-rate scheduler
  lr_scheduler:
    mode: "max"
    factor: 0.5
    patience: 5
    min_lr: 1.0e-7

  # Early stopping
  early_stopping:
    patience: 10
    monitor: "val_mean_iou"

  # Model checkpointing
  checkpoint:
    monitor: "val_mean_iou"
    save_best: true
    save_final: true

# ── Logging & output ──────────────────────────
output:
  experiments_dir: "./experiments"
  log_every_n_batches: 10        # print batch progress every N batches

# ── Reproducibility ───────────────────────────
seed: 42
