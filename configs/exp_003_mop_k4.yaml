# ──────────────────────────────────────────────
# Experiment 003 — MoP ablation: fewer prototypes
# Useful for studying the K hyperparameter
# ──────────────────────────────────────────────

experiment_name: "exp_003_mop_k4"

model:
  name: "MixtureOfPrototypes"
  in_channels: 25
  num_classes: 1
  n_groups: 5
  band_dim: 32
  n_prototypes: 4         # K=4 (half of exp_002)
  embed_dim: 64

training:
  batch_size: 8
  epochs: 200
  learning_rate: 1.0e-3
  loss: "mop_bce_dice"
  alpha: 0.3
  lambda_div: 0.1
